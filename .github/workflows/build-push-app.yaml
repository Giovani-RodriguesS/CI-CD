name: Build and Push Docker Image on Dev Env

on:
  push:
    branches:
      - 'develop'
    path:
      - app/api/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV  
          cd app/api || "Erro ao mudar de diretório"
          echo $DOCKER_USERNAME
          docker build -t $DOCKER_USERNAME/ci-api-go . || echo "Erro ao fazer o Build"
          docker push $DOCKER_USERNAME/ci-api-go || echo "Erro ao enviar Imagem para Repo remoto"
