name: Build and Push Docker Image on Dev Env

on:
  push:
    branches:
      - 'develop'
    path:
      - app/api/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/ci-api-go";
          IMAGE_TAG="latest";

          cd app/api || { echo "Erro ao mudar de diretório"; exit 1; }
          docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" . || { echo "Erro ao fazer o Build"; exit 1; };
          docker push "${IMAGE_NAME}:${IMAGE_TAG}" || { echo "Erro ao enviar Imagem para Repo remoto"; exit 1; }