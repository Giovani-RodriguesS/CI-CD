apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  selector:
    matchLabels:
      app: go-api
  replicas: 1
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
      - name: go-api
        image: giovanirodrigues/ci-api-go:latest
        ports:
        - containerPort: 8080
        
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: "ENV"
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: "DB_URL"
        - name: DB_SELECTED
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: "DB_SELECTED"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

