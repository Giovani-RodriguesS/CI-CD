apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  DB_URL: "host=db-service.database.svc.cluster.local port=5432 user=postgres password=1234 sslmode=disable"
  DB_SELECTED: "loja"
  ENV: "dev"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-api
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
        - name: go-api