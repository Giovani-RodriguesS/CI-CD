apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
spec:
  selector:
    matchLabels:
      app: go-api
  replicas: 1
  template:
    metadata:
      labels:
        app: go-api
    spec:
      containers:
      - name: go-api
        image: giovanirodrigues/go-api:latest
        ports:
        - containerPort: 8080
        
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: "DB_URL"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"

