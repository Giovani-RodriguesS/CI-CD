---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Giovani-RodriguesS/CI-CD.git
    targetRevision: HEAD
    path: dev/overlays/dev
  destination:
    server: https://kubernetes.default.svc 
    namespace: dev

  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-database
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Giovani-RodriguesS/CI-CD.git 
    targetRevision: HEAD
    path: dev/overlays/database
  destination:
    server: https://kubernetes.default.svc 
    namespace: database

  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true